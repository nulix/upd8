name: Build and Push Workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: upd8-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: upd8-aarch64
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            name: upd8-armv7
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y libglib2.0-dev libostree-dev
    
    - name: Install cross-compilation tools
      if: matrix.target != 'x86_64-unknown-linux-gnu'
      run: |
        sudo apt install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
        
        # Install cross-architecture libraries
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          sudo dpkg --add-architecture arm64
          sudo apt update
          sudo apt install -y libglib2.0-dev:arm64 libostree-dev:arm64
        elif [ "${{ matrix.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
          sudo dpkg --add-architecture armhf
          sudo apt update
          sudo apt install -y libglib2.0-dev:armhf libostree-dev:armhf
        fi
    
    - name: Install Rust target
      run: rustup target add ${{ matrix.target }}
    
    - name: Build
      run: |
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          export CC=aarch64-linux-gnu-gcc
          export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
        elif [ "${{ matrix.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
          export CC=arm-linux-gnueabihf-gcc
          export PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf
        fi
        cargo build --release --target ${{ matrix.target }} --verbose
    
    - name: Run tests (native only)
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo test --verbose
    
    - name: Upload binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: target/${{ matrix.target }}/release/upd8

  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
